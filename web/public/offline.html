<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Offline | NicoDesk</title>
<style>
  :root { --bg: #f5f2ec; --ink: #1c1a17; --mute: #6b655c; --accent: #b3522c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12110f; --ink: #efeae1; --mute: #a39b8e; } }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  main { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 24px; max-width: 28rem; margin: 0 auto; box-sizing: border-box; }
  h1 { font-family: Georgia, serif; font-weight: 600; font-size: 1.6rem; margin: 0 0 8px; }
  p { margin: 0 0 20px; line-height: 1.5; color: var(--mute); }
  button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer; align-self: flex-start; min-height: 44px; }
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>NicoDesk needs a connection to show your tasks. Your work is safe. Try again when you are back online.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
